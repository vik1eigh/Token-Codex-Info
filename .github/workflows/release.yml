name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: swift test
      - name: Package universal macOS app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${RELEASE_TAG#v}" bash ./script/package_dmg.sh
      - name: Create draft release with downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping its uploaded assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/TokenCodexInfo-*-universal.dmg \
            dist/TokenCodexInfo-*-universal.zip dist/SHA256SUMS.txt \
            --verify-tag --draft --generate-notes \
            --title "Token Codex Info $RELEASE_TAG"
