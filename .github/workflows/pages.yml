name: Publish download page

# Enable Pages with GitHub Actions in repository settings, then run manually.
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (X.Y.Z)
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test app
        run: swift test
      - name: Build app and complete download page
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash ./script/package_dmg.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/download-page/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download page
        id: deployment
        uses: actions/deploy-pages@v4
